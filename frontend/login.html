<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Spark – Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header>
    <nav class="site-nav" aria-label="Main">
      <a class="logo" href="index.html"><span class="logo-dot" aria-hidden="true"></span>Daily Spark</a>
      <ul class="nav-links">
        <li><a href="index.html">Today</a></li>
        <li><a href="#">Archive</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
        <a class="btn" href="register.html">Register</a>
      </div>
    </nav>
  </header>

  <main id="main" class="auth-wrap">
    <section class="panel" aria-labelledby="login-title">
      <h1 id="login-title">Log in</h1>
      <p class="sub">Welcome back. Pick up where you left off.</p>

      <!-- Milestone 1: visual only. Real authentication is added in Milestone 2. -->
      <form data-placeholder>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-block" type="submit">Log in</button>
        <p class="form-note" role="status" hidden>Login isn’t connected yet. Authentication arrives in Milestone 2.</p>
      </form>

      <p class="alt">New here? <a href="register.html">Create an account</a></p>
    </section>
  </main>

  <footer class="site-footer">Daily Spark · IT 340 course project</footer>
</body>
</html>
